name: Release CLI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-signing-integration:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download the signed smoke-test binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download signing-validation-20261014 --repo Tencent/BrowserSkill --pattern bsk.exe --dir signed
      - name: Verify Authenticode publisher, chain and timestamp
        shell: pwsh
        run: ./scripts/verify-windows-signature.ps1 -Path signed/bsk.exe -ExpectedSha256 8d650b618ca0111a921d9987a2e2f5568312096394411ab6428c8587fa40902c
      - name: Execute the signed CLI
        shell: pwsh
        run: |
          $version = & ./signed/bsk.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Signed CLI failed to execute' }
          if ($version -notmatch '0\.3\.2') { throw "Unexpected CLI version: $version" }
          $version
